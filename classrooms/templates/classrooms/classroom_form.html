{% extends "base.html" %}

{% block content %}

<h2>Classroom Form</h2>

<form method="post">

    {% csrf_token %}

    {% if form.errors %}
        <div class="alert alert-danger">
            {{ form.errors }}
        </div>
    {% endif %}

    {{ form.as_p }}

    <button class="btn btn-success">
        Save
    </button>

    <a href="{% url 'classroom_list' %}"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
