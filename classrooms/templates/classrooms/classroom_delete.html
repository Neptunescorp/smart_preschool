{% extends "base.html" %}

{% block content %}

<h2>Delete Classroom</h2>

<div class="alert alert-danger">

Are you sure you want to delete

<strong>{{ object.name }}</strong>?

</div>

<form method="post">

    {% csrf_token %}

    <button class="btn btn-danger">
        Delete
    </button>

    <a href="{% url 'classroom_list' %}"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
