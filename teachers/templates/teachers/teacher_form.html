{% extends "base.html" %}

{% block content %}

<h2>Teacher Form</h2>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {% if form.errors %}
    <div class="alert alert-danger">
        {{ form.errors }}
    </div>
    {% endif %}

    {{ form.as_p }}

    <button class="btn btn-success">
        Save
    </button>

    <a href="{% url 'teacher_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
