{% extends "base.html" %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h3>Delete Behavior Record</h3>

        <p>
            Are you sure you want to delete this evaluation?
        </p>

        <form method="post">

            {% csrf_token %}

            <button class="btn btn-danger">
                Delete
            </button>

            <a href="{% url 'behavior_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
