{% extends "base.html" %}

{% block content %}

<h2>Behavior Evaluation</h2>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Save Evaluation
    </button>

    <a href="{% url 'behavior_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
