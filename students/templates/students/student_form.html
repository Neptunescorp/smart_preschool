{% extends "base.html" %}

{% block content %}

<h2>Student Form</h2>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {% if form.errors %}
    <div class="alert alert-danger">
        {{ form.errors }}
    </div>
    {% endif %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Save
    </button>

    <a href="{% url 'student_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
