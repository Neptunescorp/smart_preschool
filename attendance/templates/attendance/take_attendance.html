{% extends "base.html" %}

{% block content %}

<h2>Take Attendance</h2>

<form method="get">

<label>Select Classroom</label>

<select
name="classroom"
class="form-select mb-3"
onchange="this.form.submit()">

<option value="">Choose Classroom</option>

{% for classroom in classrooms %}

<option
value="{{ classroom.id }}"
{% if request.GET.classroom == classroom.id|stringformat:"s" %}
selected
{% endif %}>

{{ classroom.name }}

</option>

{% endfor %}

</select>

</form>

{% if students %}

<form method="post">

{% csrf_token %}

<input
type="hidden"
name="classroom"
value="{{ request.GET.classroom }}">

<input
    type="date"
    name="date"
    value="{{ today|date:'Y-m-d' }}"
    class="form-control mb-3"
    required>
    

<table class="table">

<tr>
<th>Student</th>
<th>Status</th>
</tr>

{% for student in students %}

<tr>

<td>
{{ student.first_name }}
{{ student.last_name }}
</td>

<td>

<select
name="student_{{ student.id }}"
class="form-select">

<option>Present</option>
<option>Absent</option>
<option>Late</option>

</select>

</td>

</tr>

{% endfor %}

</table>

<button class="btn btn-success">
Save Attendance
</button>

</form>

{% endif %}

{% endblock %}
